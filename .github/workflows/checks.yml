# Runs every check on each push and pull request: types, format, unit and gate tests,
# and the browser tests. Steps wait until the project has a package.json.
name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: ${{ hashFiles('package-lock.json') != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm ci
      - if: ${{ hashFiles('package-lock.json') != '' }}
        run: npx playwright install --with-deps chromium
      - if: ${{ hashFiles('package-lock.json') != '' }}
        run: npm test
      - if: ${{ hashFiles('package-lock.json') == '' }}
        run: echo "No package-lock.json yet; nothing to check."
